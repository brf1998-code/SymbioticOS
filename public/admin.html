<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbiotic OS · Admin</title>
<style>
  :root { --ink:#1c242e; --steel:#51606f; --line:#d5dbe3; --fog:#f2f4f7; --navy:#1f3a5f; --green:#2e7d4f; --red:#b3261e; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--fog); color:var(--ink); padding:18px; padding-bottom:90px; max-width:1100px; margin:0 auto; }
  h1 { font-size:21px; margin-bottom:4px; }
  .sub { color:var(--steel); font-size:13px; line-height:1.5; }
  a { color:var(--navy); }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; font-size:13px; }
  .card h2 { font-size:17px; } .card h2 small { font-weight:400; color:var(--steel); font-size:12px; margin-left:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin:10px 0; }
  .kpi { background:var(--fog); border-radius:8px; padding:8px; } .kpi b { display:block; font-size:20px; } .kpi span { font-size:11px; color:var(--steel); text-transform:uppercase; letter-spacing:.05em; }
  ul { margin:6px 0 0 18px; } li { margin:3px 0; }
  select, input { font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:7px; padding:7px; }
  button { border:none; border-radius:7px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer; margin:8px 6px 0 0; min-height:36px; }
  .go { background:var(--green); color:#fff; } .quiet { background:#e5e9ee; color:var(--ink); }
  .links a { margin-right:12px; font-weight:600; }
</style>
</head>
<body>
  <h1>Admin</h1>
  <p class="sub" id="top"></p>
  <div id="companies"></div>
  <div class="card">
    <h2>Add a company</h2>
    <p class="sub">Each company gets its own improvement board, modules, agent docs, and model choices at <code>/c/&lt;slug&gt;/</code>. Same passwords for now.</p>
    <input id="c-slug" placeholder="slug (e.g. acme)" style="max-width:200px"> <input id="c-name" placeholder="Company name" style="max-width:300px">
    <button class="go" onclick="addCompany()">Create</button>
  </div>
<script>
let D = null;
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function ml(id) { const m = D.models.find(x => x.id === id); return m ? m.label : id; }
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) alert(j.error || "failed");
  return j;
}
async function load() {
  const r = await fetch("/api/admin/overview");
  if (r.status === 401) { location.href = "/login?next=/admin"; return; }
  if (r.status === 403) { document.body.innerHTML = "<p style='padding:20px'>Admin login required.</p>"; return; }
  D = await r.json();
  document.getElementById("top").textContent = `${D.companies.length} compan${D.companies.length === 1 ? "y" : "ies"} · AI spend this month $${D.totalSpend.toFixed(2)} of $${D.monthlyCap.toFixed(2)} cap · defaults: propose ${ml(D.defaults.propose)}, build ${ml(D.defaults.build)}, review ${ml(D.defaults.review)}`;
  document.getElementById("companies").innerHTML = D.companies.map(c => `<div class="card">
    <h2>${esc(c.name)} <small>/c/${c.slug}/ · since ${new Date(c.created_at).toLocaleDateString()}</small></h2>
    <div class="links"><a href="/c/${c.slug}/">Improvement board</a><a href="/c/${c.slug}/agents">Agent settings and docs</a>${c.modules.map(m => `<a href="/c/${c.slug}/m/${m.name}/">${esc(m.title)} (v${m.live_version})</a>`).join("")}</div>
    <div class="grid">
      <div class="kpi"><b>${c.feedback.open}</b><span>open feedback</span></div>
      <div class="kpi"><b>${c.feedback.total}</b><span>feedback total</span></div>
      <div class="kpi"><b>${c.runs.deployed} / ${c.runs.n}</b><span>builds deployed / started</span></div>
      <div class="kpi"><b>$${c.spend_usd.toFixed(2)}</b><span>AI spend this month</span></div>
    </div>
    <div class="sub"><b>Models:</b> propose ${ml(c.models.propose)}, build ${ml(c.models.build)}, review ${ml(c.models.review)}</div>
    <div class="sub" style="margin-top:6px"><b>Agent docs:</b>${c.docs.length ? "<ul>" + c.docs.map(d => `<li>${esc(d.name)} <span class="sub">(${d.module ? "module " + esc(d.module) : "company-wide"}, ${d.bytes} bytes, ${d.source === "repo" ? "seeded" : "edited"})</span></li>`).join("") + "</ul>" : " none"}</div>
    <div class="sub" style="margin-top:6px"><b>Modules:</b>${c.modules.length ? "<ul>" + c.modules.map(m => `<li>${esc(m.title)} (${m.name}) v${m.live_version}${m.staged_version ? `, v${m.staged_version} staged` : ""}</li>`).join("") + "</ul>" : " none"}</div>
    <div style="margin-top:6px"><select id="lib-${c.slug}">${D.library.filter(l => !c.modules.some(m => m.name === l.name)).map(l => `<option value="${l.name}">${esc(l.title)}</option>`).join("") || "<option value=''>all library modules added</option>"}</select>
      <button class="quiet" onclick="addModule('${c.slug}')">Add module from library</button></div>
  </div>`).join("");
}
async function addCompany() {
  const slug = document.getElementById("c-slug").value.trim().toLowerCase(), name = document.getElementById("c-name").value.trim();
  await post("/api/admin/companies", { slug, name }); load();
}
async function addModule(slug) {
  const mod = document.getElementById("lib-" + slug).value; if (!mod) return;
  await post(`/api/admin/companies/${slug}/modules`, { module: mod }); load();
}
load();
</script>
<script src="/assets/feedback-widget.js" data-module="platform"></script>
</body>
</html>
